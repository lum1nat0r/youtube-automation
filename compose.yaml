services:
  yt-service:
    image: ghcr.io/lum1nat0r/youtube-automation:latest
    container_name: yt-service
    restart: unless-stopped
    ports:
      # Nur localhost erreichbar (der VPS-Cron ruft über SSH -> curl auf)
      # Achtung: 8080 ist auf apollo durch Immich belegt!
      - "127.0.0.1:8082:8000"
    volumes:
      - /mnt/user/video-material/Lumis-Lane/2_output:/material
      - /mnt/user/appdata/shorts-pipeline:/pipeline
      - /mnt/user/appdata/youtube-uploader/config:/config
    # Local, credential-free AI shadow analysis via Apollo's Ollama service.
    # The host-gateway mapping never exposes Ollama outside Docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AI_METADATA_PROVIDER: ollama
      AI_METADATA_BASE_URL: http://host.docker.internal:11434
      AI_METADATA_MODEL: qwen3.5:9b
